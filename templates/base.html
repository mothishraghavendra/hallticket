<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Hall Ticket Generator{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/css/style.css" />
  {% block head_extra %}{% endblock %}
</head>
<body>

  <header class="top-nav" role="banner">
    <div class="top-nav__inner">

      <a href="/" class="top-nav__brand" aria-label="Hall Ticket Generator — home">
        <span class="top-nav__brand-mark" aria-hidden="true">HT</span>
        <span class="top-nav__brand-text"><strong>Hall ticket</strong> application</span>
      </a>

      <nav class="top-nav__links" aria-label="Site navigation">
        <a href="/" class="top-nav__link top-nav__link--active" aria-current="page">Application form</a>
        <a href="/docs" class="top-nav__link" target="_blank" rel="noopener">Help</a>
      </nav>

      <button class="top-nav__hamburger" id="nav-toggle"
              aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-nav">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>

    </div>

    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation" hidden>
      <a href="/" class="mobile-nav__link mobile-nav__link--active" aria-current="page">Application form</a>
      <a href="/docs" class="mobile-nav__link" target="_blank" rel="noopener">Help</a>
    </nav>
  </header>

  <main id="main-content" class="page-main" role="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="site-footer__inner">
      <p class="site-footer__legal">Hall Ticket Application</p>
    </div>
  </footer>

  <script>
    (function () {
      const btn = document.getElementById('nav-toggle');
      const nav = document.getElementById('mobile-nav');
      btn.addEventListener('click', function () {
        const open = nav.hasAttribute('hidden');
        if (open) { nav.removeAttribute('hidden'); btn.setAttribute('aria-expanded', 'true'); }
        else       { nav.setAttribute('hidden', ''); btn.setAttribute('aria-expanded', 'false'); }
      });
    })();
  </script>

  {% block scripts_extra %}{% endblock %}
</body>
</html>
