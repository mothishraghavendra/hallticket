[project]
name = "ticket-gen"
version = "1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
	"fastapi>=0.115,<1.0",
	"uvicorn[standard]>=0.34,<1.0",
	"pydantic>=2.10,<3.0",
	"python-multipart>=0.0.20,<1.0",
	"Jinja2>=3.1,<4.0",
	"Pillow>=11,<13",
	"PyMuPDF>=1.25,<2.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.fastapi.static]
cdn = true